<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app de celular, coluna única (máx. 560px), cabeçalho azul Voltex, barra inferior fixa */
:root{
  --brand:#172C35;      /* fundo do logo Voltex */
  --brand-2:#22404C;
  --accent:#E8742A;
  --bg:#EEF2F4; --surface:#FFFFFF; --fg:#172C35; --muted:#5F7782; --line:#D6DFE3;
  --ok-bg:#DDF3E4; --ok-fg:#1E7B3E; --nc-bg:#FCE1DE; --nc-fg:#B42318; --pd-bg:#FFF1DC; --pd-fg:#9A5B00;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1D23; --surface:#18292F; --fg:#E6EEF1; --muted:#93A9B2; --line:#2A3F47; --brand-2:#2A4A57;
  --ok-bg:#163A25; --ok-fg:#7FD69C; --nc-bg:#43201C; --nc-fg:#FF9A8E; --pd-bg:#3D2C10; --pd-fg:#F5C26B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1D23; --surface:#18292F; --fg:#E6EEF1; --muted:#93A9B2; --line:#2A3F47; --brand-2:#2A4A57;
  --ok-bg:#163A25; --ok-fg:#7FD69C; --nc-bg:#43201C; --nc-fg:#FF9A8E; --pd-bg:#3D2C10; --pd-fg:#F5C26B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
#app{max-width:560px;margin:0 auto;padding-bottom:96px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.hd{background:#172C35;color:#fff;padding:20px 16px 18px;border-radius:0 0 20px 20px}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd h1{font-size:28px;line-height:1.05;letter-spacing:.2px}
.hd p{margin:4px 0 0;color:#9FB4BE;font-size:13px}
.hd .logo{height:38px;flex:none}
.hd.sub{padding-block:14px}
.hd.sub h1{font-size:22px}
.back{background:none;border:0;color:#fff;font-size:22px;padding:4px 10px 4px 0}
.search{margin-top:14px;display:block;width:100%;background:#22404C;border:0;border-radius:12px;padding:11px 14px;color:#fff}
.search::placeholder{color:#8AA3AE}
.wrap{padding:16px;display:flex;flex-direction:column;gap:14px}
.cta{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:0 4px 14px rgba(232,116,42,.28)}
.cta b{display:block;font-size:17px;font-family:var(--f-display);letter-spacing:.3px}
.cta small{font-size:12.5px;opacity:.92}
.plus{width:34px;height:34px;flex:none;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:22px}
.lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:4px 2px -4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 4px;text-align:center;font-size:12px;font-weight:600;line-height:1.25}
.ic{width:38px;height:38px;border-radius:10px;margin:0 auto 6px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;font-family:var(--f-mono)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%}
.item .t{min-width:0}
.item b{display:block;font-size:15px}
.item span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.pill{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap;flex:none}
.ok{background:var(--ok-bg);color:var(--ok-fg)} .nc{background:var(--nc-bg);color:var(--nc-fg)} .pd{background:var(--pd-bg);color:var(--pd-fg)}
.item .ex,.ex{display:inline-block;margin-top:0;font-size:10.5px;font-weight:600;letter-spacing:.6px;background:var(--brand-2);color:#fff;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card h3{font-size:17px;letter-spacing:.2px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12.5px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-height:44px}
.f textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt{width:100%;border-collapse:collapse;font-size:13.5px}
.mt th{font-size:11.5px;color:var(--muted);text-align:left;padding:0 4px 6px;font-weight:600}
.mt td{padding:3px 3px}
.mt input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 6px;min-width:0;font-variant-numeric:tabular-nums}
.mt .st{text-align:center;font-size:11px;font-weight:700;width:34px}
.del{background:none;border:0;color:var(--muted);font-size:18px;padding:4px 6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;font-weight:600;min-height:44px}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.dng{color:var(--nc-fg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}
.res{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;font-weight:600}
.res big{font-family:var(--f-display);font-size:22px;letter-spacing:.4px}
.res small{display:block;font-weight:400;font-size:12.5px}
.stats{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{display:flex;flex-direction:column;gap:6px;min-width:0}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--line);display:block}
.ph input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:13px}
.ph .bar{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:14px;border:1px dashed var(--line);border-radius:12px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.nav-in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around;align-items:center}
.nav button{background:none;border:0;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 10px;min-width:64px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--fg);font-weight:600}
.nav .fab{width:58px;height:58px;border-radius:50%;background:var(--brand);color:#fff;margin-top:-28px;border:4px solid var(--bg);justify-content:center;padding:0;min-width:0}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--brand);color:#fff}
.pdfic{width:40px;height:48px;flex:none;border-radius:6px;background:#B42318;color:#fff;display:grid;place-items:center;font:700 11px var(--f-mono)}
.item .lead{display:flex;align-items:center;gap:12px;min-width:0}
.sync{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:#22404C;border:0;color:#CFE0E6;border-radius:20px;padding:6px 12px;font-size:12.5px}
.sync i{width:8px;height:8px;border-radius:50%;background:#8AA3AE;display:inline-block}
.sync.ok i{background:#5BD68A}.sync.pend i{background:#F5C26B}.sync.err i{background:#FF8A7A}.sync.run i{background:#7CC4F5}
.f code{font-family:var(--f-mono);font-size:12px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--brand);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:9;max-width:calc(100% - 32px);text-align:center}
.note{font-size:12.5px;color:var(--muted)}
.sheet{position:fixed;inset:0;background:rgba(10,20,25,.55);display:flex;align-items:flex-end;justify-content:center;z-index:8}
.sheet .card{width:100%;max-width:560px;border-radius:18px 18px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion: no-preference){.item,.tile,.btn,.cta{transition:transform .12s}.item:active,.tile:active,.btn:active,.cta:active{transform:scale(.98)}}
</style>

/* ---------- Resultado automático ---------- */
function avalia(i){
  const f=i.f||{},m=i.med||[];let r="",motivo="",stats="";
  if(i.tipo==="RF"){
    const n=(i.fotos||[]).length;if(n){r="REG";motivo=n+" foto(s) registrada(s)"}else motivo="Adicione as fotos do registro";
    return{r,motivo,stats};
  }
  if(i.tipo==="TH"){
    if(f.vazamento==="Sim"||f.queda==="Sim"){r="NC";motivo=f.vazamento==="Sim"?"Vazamento detectado":"Queda de pressão"}
    else if(f.vazamento==="Não"&&f.queda==="Não"){r="OK";motivo="Sem vazamento e sem queda de pressão"}
    else motivo="Informe vazamento e queda de pressão";
  }else if(i.tipo==="LP"){
    if(f.indic==="Indicações relevantes"){r="NC";motivo="Indicações relevantes encontradas"}
    else if(f.indic){r="OK";motivo=f.indic}else motivo="Informe as indicações encontradas";
  }else{
    const vals=m.map(x=>num(x.valor)).filter(v=>!isNaN(v));
    if(vals.length){const mn=Math.min(...vals),mx=Math.max(...vals),md=vals.reduce((a,b)=>a+b,0)/vals.length;
      stats=`${vals.length} leituras · mín ${fmtN(mn)} · máx ${fmtN(mx)} · média ${fmtN(md)}`}
    const fora=m.filter(x=>pontoStatus(i,x)==="NC").length, pend=m.filter(x=>pontoStatus(i,x)==="").length;
    if(!m.length)motivo="Adicione as medições";
    else if(fora){r="NC";motivo=fora+" ponto(s) fora do critério"}
    else if(pend)motivo=pend+" ponto(s) sem valor ou sem critério";
    else{r="OK";motivo="Todos os pontos dentro do critério"}
  }
  if(i.override){r=i.override;motivo="Definido manualmente pelo inspetor"}
  return{r,motivo,stats};
}
function pontoStatus(i,x){
  const v=num(x.valor),f=i.f||{};if(isNaN(v))return"";
  if(i.tipo==="CH"){const mn=num(f.minima);if(isNaN(mn))return"";return v>=mn?"OK":"NC"}
  if(i.tipo==="TI"){const mn=num(f.esp_min),mx=num(f.esp_max);if(isNaN(mn)&&isNaN(mx))return"";if(!isNaN(mn)&&v<mn)return"NC";if(!isNaN(mx)&&v>mx)return"NC";return"OK"}
  if(i.tipo==="DI"){const n=num(x.nominal),t=num(x.tol);if(isNaN(n)||isNaN(t))return"";return Math.abs(v-n)<=t+1e-9?"OK":"NC"}
  return"";
}

function nav(){const a=V.name;const b=(k,lab,ic)=>`<button class="${a===k?"on":""}" data-go="${k}">${ICON[ic]}${lab}</button>`;
 return`<nav class="nav"><div class="nav-in">${b("home","Início","home")}${b("clients","Clientes","cli")}<button class="fab" data-act="nova" aria-label="Nova inspeção">${ICON.cam}</button>${b("all","Inspeções","rel")}${b("cfg","Ajustes","cfg")}</div></nav>`}
function head(title,sub,back){
 if(!back)return`<header class="hd"><div class="hd-row"><div><h1>${esc(title)}</h1>${sub?`<p>${esc(sub)}</p>`:""}</div><img class="logo" src="${LOGO}" alt="Voltex Soluções Industriais"></div>${V.name==="home"&&IS_PWA&&LC.cid?syncChip():""}${V.name==="home"?`<input class="search" id="q" placeholder="Buscar cliente, TAG ou nº de série" value="${esc(q)}">`:""}</header>`;
 return`<header class="hd sub"><div class="hd-row"><button class="back" data-back aria-label="Voltar">←</button><div style="flex:1;min-width:0"><h1>${esc(title)}</h1>${sub?`<p>${esc(sub)}</p>`:""}</div><img class="logo" style="height:28px" src="${LOGO}" alt="Voltex"></div></header>`}

function inspItem(i){const e=eqOf(i),c=clOf(e),t=TYPES[i.tipo],a=avalia(i);
 return`<button class="item" data-open="${i.id}"><div class="t"><b>${esc(t.nome)}${i.exemplo?'<span class="ex">EXEMPLO</span>':""}</b><span>${esc(c.nome)} · ${esc(e.tag)} · ${fmtData(i.data)} · ${i.fotos.length} foto(s)</span></div>${pill(a.r)}</button>`}

/* ---------- Telas ---------- */
function vHome(){
 const d=new Date();const sub=`Inspetor: ${S.cfg.inspetor||"-"} · ${d.toLocaleDateString("pt-BR")}`;
 let rec=[...S.insps].sort((a,b)=>(b.upd||0)-(a.upd||0));
 if(q){const k=q.toLowerCase();rec=rec.filter(i=>{const e=eqOf(i),c=clOf(e);return[c.nome,e.tag,e.serie,e.desc,TYPES[i.tipo].nome].join(" ").toLowerCase().includes(k)})}
 return head("Inspeção Qualidade",sub)+`<main class="wrap">
 <button class="cta" data-act="nova"><span class="plus">+</span><span><b>Nova inspeção</b><small>Cliente, equipamento e ensaio</small></span></button>
 ${IS_PWA&&instalar?'<button class="btn" data-act="instalar">Instalar app na tela inicial</button>':""}
 <div class="lbl">Ensaios e registros</div>
 <div class="grid">${ORDER.map(k=>`<button class="tile" data-act="nova" data-tipo="${k}"><div class="ic" style="background:${TYPES[k].cor}">${TYPES[k].sig}</div>${TYPES[k].nome.replace(" ","<br>")}</button>`).join("")}</div>
 <div class="lbl">${q?"Resultado da busca":"Inspeções recentes"}</div>
 <div class="list">${rec.slice(0,q?50:6).map(inspItem).join("")||'<div class="empty">Nenhuma inspeção encontrada.</div>'}</div></main>`}

const fmtMB=n=>(n/1048576).toFixed(n<1048576?2:1).replace(".",",")+" MB";
function projItem(p,mostraEq){const e=S.equips.find(x=>x.id===p.equipId)||{},c=clOf(e);
 return`<button class="item" data-proj="${p.id}"><div class="lead"><div class="pdfic">PDF</div><div class="t"><b style="overflow-wrap:anywhere">${esc(p.nome)}</b><span>${mostraEq?esc(c.nome)+" · "+esc(e.tag)+" · ":""}${fmtMB(p.tam||0)} · ${fmtData(p.data)}${p.driveId?" · no Drive":""}</span></div></div><span aria-hidden="true">›</span></button>`}
function vAll(){const tab=V.tab||"insp";const l=[...S.insps].sort((a,b)=>(b.data||"").localeCompare(a.data||""));
 const pj=[...(S.projetos||[])].sort((a,b)=>(b.upd||0)-(a.upd||0));
 const tabs=`<div class="tabs" role="tablist"><button class="${tab==="insp"?"on":""}" data-tab="insp">Inspeções (${l.length})</button><button class="${tab==="proj"?"on":""}" data-tab="proj">Projetos PDF (${pj.length})</button></div>`;
 if(tab==="proj")return head("Projetos","Desenhos e projetos em PDF por equipamento")+`<main class="wrap">${tabs}
 <button class="btn pri" data-act="addProj">+ Adicionar projeto (PDF)</button>
 <div class="list">${pj.map(p=>projItem(p,1)).join("")||'<div class="empty">Nenhum projeto ainda. Toque em "Adicionar projeto" e escolha o equipamento e o arquivo PDF.</div>'}</div></main>`;
 return head("Inspeções","Todas as inspeções e projetos")+`<main class="wrap">${tabs}<div class="list">${l.map(inspItem).join("")||'<div class="empty">Nenhuma inspeção ainda.</div>'}</div></main>`}

function vClients(){
 return head("Clientes","Cliente → Equipamento → Ensaio")+`<main class="wrap">
 <button class="btn pri" data-act="addCli">+ Novo cliente</button>
 <div class="list">${S.clients.map(c=>{const n=S.equips.filter(e=>e.clientId===c.id).length;return`<button class="item" data-cli="${c.id}"><div class="t"><b>${esc(c.nome)}${c.exemplo?'<span class="ex">EXEMPLO</span>':""}</b><span>${n} equipamento(s)</span></div><span aria-hidden="true">›</span></button>`}).join("")||'<div class="empty">Cadastre o primeiro cliente.</div>'}</div></main>`}

function vClient(){const c=S.clients.find(x=>x.id===V.id);if(!c)return go({name:"clients"});
 const eqs=S.equips.filter(e=>e.clientId===c.id);
 return head(c.nome,"Equipamentos do cliente",1)+`<main class="wrap">
 <button class="btn pri" data-act="addEq" data-c="${c.id}">+ Novo equipamento</button>
 <div class="list">${eqs.map(e=>{const n=S.insps.filter(i=>i.equipId===e.id).length;return`<button class="item" data-eq="${e.id}"><div class="t"><b>${esc(e.tag)}${e.exemplo?'<span class="ex">EXEMPLO</span>':""}</b><span>${esc(e.desc)}${e.serie?" · Nº série "+esc(e.serie):""} · ${n} ensaio(s)</span></div><span aria-hidden="true">›</span></button>`}).join("")||'<div class="empty">Nenhum equipamento cadastrado.</div>'}</div>
 <button class="btn dng" data-act="delCli" data-c="${c.id}">Excluir cliente</button></main>`}

function vEquip(){const e=S.equips.find(x=>x.id===V.id);if(!e)return go({name:"clients"});const c=clOf(e);
 const l=S.insps.filter(i=>i.equipId===e.id);const nf=l.reduce((a,i)=>a+i.fotos.length,0);
 return head(e.tag,`${c.nome} · ${e.desc||""}`,1)+`<main class="wrap">
 <div class="card"><div class="two"><div class="f"><label>TAG</label><input data-eqf="tag" value="${esc(e.tag)}"></div><div class="f"><label>Nº de série</label><input data-eqf="serie" value="${esc(e.serie)}"></div></div>
 <div class="f"><label>Descrição</label><input data-eqf="desc" value="${esc(e.desc)}"></div></div>
 <div class="lbl">Novo ensaio neste equipamento</div>
 <div class="grid">${ORDER.map(k=>`<button class="tile" data-act="novoEq" data-tipo="${k}" data-e="${e.id}"><div class="ic" style="background:${TYPES[k].cor}">${TYPES[k].sig}</div>${TYPES[k].nome.replace(" ","<br>")}</button>`).join("")}</div>
 <div class="lbl">Ensaios realizados</div>
 <div class="list">${l.map(inspItem).join("")||'<div class="empty">Nenhum ensaio ainda.</div>'}</div>
 <div class="lbl">Projeto (PDF)</div>
 <div class="list">${(S.projetos||[]).filter(p=>p.equipId===e.id).map(p=>projItem(p,0)).join("")||'<div class="empty">Nenhum PDF de projeto neste equipamento.</div>'}</div>
 <button class="btn" data-act="addProjEq" data-e="${e.id}">+ Adicionar PDF do projeto</button>
 <button class="btn acc" data-act="zipEq" data-e="${e.id}" ${nf?"":"disabled"}>Exportar ZIP com todas as fotos (${nf})</button>
 <button class="btn dng" data-act="delEq" data-e="${e.id}">Excluir equipamento</button></main>`}

function fieldHTML(i,[k,lab,tp,opts]){const v=(i.f||{})[k]??"";
 if(tp==="sel")return`<div class="f"><label for="f_${k}">${lab}</label><select id="f_${k}" data-f="${k}">${opts.map(o=>`<option ${o===v?"selected":""} value="${esc(o)}">${o||"Selecione…"}</option>`).join("")}</select></div>`;
 if(tp==="area")return`<div class="f"><label for="f_${k}">${lab}</label><textarea id="f_${k}" data-f="${k}">${esc(v)}</textarea></div>`;
 return`<div class="f"><label for="f_${k}">${lab}</label><input id="f_${k}" data-f="${k}" ${tp==="num"?'inputmode="decimal"':""} value="${esc(v)}"></div>`}

function resBox(i){const a=avalia(i);const cls=a.r==="OK"||a.r==="REG"?"ok":a.r==="NC"?"nc":"pd";const t=a.r==="REG"?"REGISTRADO":a.r==="OK"?"APROVADO":a.r==="NC"?"REPROVADO":"PENDENTE";
 return`<div class="res ${cls}"><div><big>${t}</big><small>${esc(a.motivo)}</small></div></div>${a.stats?`<div class="stats">${esc(a.stats)}</div>`:""}`}

function vInsp(){const i=S.insps.find(x=>x.id===V.id);if(!i)return go({name:"home"});const t=TYPES[i.tipo],e=eqOf(i),c=clOf(e);
 const campos=t.campos;const pairs=[];
 let med="";if(t.med){med=`<div class="card"><h3>Medições</h3><div style="overflow-x:auto"><table class="mt"><thead><tr>${t.med.cols.map(x=>`<th>${x[1]}</th>`).join("")}<th></th><th></th></tr></thead><tbody>${i.med.map((r,ri)=>`<tr>${t.med.cols.map(([k,,tp])=>`<td><input data-m="${ri}" data-mk="${k}" ${tp==="num"?'inputmode="decimal"':""} value="${esc(r[k])}" aria-label="${k} ${ri+1}"></td>`).join("")}<td class="st" id="st${ri}">${stTxt(pontoStatus(i,r))}</td><td><button class="del" data-delm="${ri}" aria-label="Remover linha">×</button></td></tr>`).join("")}</tbody></table></div>
 <button class="btn" data-act="addM">+ Adicionar ponto</button></div>`}
 return head(t.nome,`${c.nome} · ${e.tag} · ${i.num||""}`,1)+`<main class="wrap">
 ${i.exemplo?'<div class="note">Esta inspeção é um exemplo. Você pode editar, testar a exportação ou excluir.</div>':""}
 <div id="resWrap">${resBox(i)}</div>
 <div class="card"><h3>Identificação</h3><div class="two"><div class="f"><label for="f_data">Data do ensaio</label><input type="date" id="f_data" data-top="data" value="${esc(i.data)}"></div><div class="f"><label for="f_num">Nº do relatório</label><input id="f_num" data-top="num" value="${esc(i.num)}"></div></div>
 <div class="note">${esc(c.nome)} → ${esc(e.tag)}${e.serie?" (Nº série "+esc(e.serie)+")":""} → ${esc(t.nome)}</div></div>
 <div class="card"><h3>Dados do ensaio</h3>${campos.map(x=>fieldHTML(i,x)).join("")}</div>
 ${med}
 <div class="card"><h3>Registro fotográfico</h3>
 <div class="row"><button class="btn pri" data-act="cam">Tirar foto</button><button class="btn" data-act="gal">Da galeria</button></div>
 <div class="photos" id="photos">${i.fotos.map((p,pi)=>`<div class="ph"><img data-pid="${p.id}" alt="Foto ${pi+1}"><input data-leg="${pi}" placeholder="Descrição da foto" value="${esc(p.leg)}"><div class="bar"><span>${fotoNome(i,pi)}</span><button class="del" data-delp="${pi}" aria-label="Excluir foto">×</button></div></div>`).join("")}</div>
 ${i.fotos.length?"":'<div class="empty">Nenhuma foto. Data, hora, cliente e TAG são gravados na foto.</div>'}</div>
 <div class="card"><h3>Conclusão</h3><div class="f"><label for="f_obs">Observações</label><textarea id="f_obs" data-top="obs">${esc(i.obs)}</textarea></div>
 ${t.semResultado?"":`<div class="f"><label for="f_ov">Resultado final</label><select id="f_ov" data-top="override"><option value="" ${!i.override?"selected":""}>Automático (pelos critérios)</option><option value="OK" ${i.override==="OK"?"selected":""}>Aprovado (manual)</option><option value="NC" ${i.override==="NC"?"selected":""}>Reprovado (manual)</option></select></div>`}</div>
 <button class="btn acc" data-act="pdf">Exportar relatório PDF</button>
 <button class="btn" data-act="zip" ${i.fotos.length?"":"disabled"}>Exportar ZIP das fotos</button>
 <button class="btn dng" data-act="delI">Excluir inspeção</button></main>`}
const stTxt=s=>s==="OK"?'<span style="color:var(--ok-fg)">OK</span>':s==="NC"?'<span style="color:var(--nc-fg)">NC</span>':'';
const fotoNome=(i,pi)=>{const e=eqOf(i),c=clOf(e);return`${slug(c.nome)}_${slug(e.tag)}_${TYPES[i.tipo].sig}_foto${String(pi+1).padStart(2,"0")}.jpg`};

function vCfg(){return head("Ajustes","Dados usados nos relatórios")+`<main class="wrap">
 <div class="card"><div class="f"><label for="c_ins">Nome do inspetor</label><input id="c_ins" data-cfg="inspetor" value="${esc(S.cfg.inspetor)}"></div>
 <div class="f"><label for="c_reg">Qualificação / registro (opcional)</label><input id="c_reg" data-cfg="registro" value="${esc(S.cfg.registro)}"></div></div>
 ${IS_PWA&&instalar?'<button class="btn acc" data-act="instalar">Instalar app na tela inicial</button>':""}
 ${IS_PWA?cardDrive():""}
 <div class="card"><h3>Backup dos dados</h3><p class="note" style="margin:0">Gera um arquivo com todas as inspeções, fotos e projetos. Use para guardar no PC ou para passar os dados para outro celular ou para o app instalado.</p>
 <div class="row"><button class="btn pri" data-act="bk">Fazer backup</button><button class="btn" data-act="rest">Restaurar backup</button></div></div>
 <div class="card"><h3>Sobre esta versão</h3><p class="note" style="margin:0">Versão 0.4${IS_PWA?" (app instalável)":""}. ${IS_PWA&&LC.cid?"Os dados ficam neste aparelho e são sincronizados com a pasta Voltex Qualidade do seu Google Drive.":"Os dados ficam salvos somente neste aparelho. Faça backup ou exporte PDF e ZIP com frequência."}</p>
 <div class="stats">${S.clients.length} cliente(s) · ${S.equips.length} equipamento(s) · ${S.insps.length} inspeção(ões) · ${S.insps.reduce((a,i)=>a+i.fotos.length,0)} foto(s) · ${(S.projetos||[]).length} projeto(s)</div></div>
 ${S.clients.some(c=>c.exemplo)?'<button class="btn dng" data-act="delEx">Apagar dados de exemplo</button>':""}</main>`}

function vNova(){const pre=V.tipo||"";
 return head("Nova inspeção","Escolha o cliente, o equipamento e o ensaio",1)+`<main class="wrap"><div class="card">
 <div class="f"><label for="n_cli">Cliente</label><select id="n_cli">${S.clients.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join("")}<option value="__new">+ Novo cliente…</option></select></div>
 <div class="f" id="n_cliNew" hidden><label for="n_cliNome">Nome do novo cliente</label><input id="n_cliNome" placeholder="Ex.: Águia"></div>
 <div class="f"><label for="n_eq">Equipamento (TAG)</label><select id="n_eq"></select></div>
 <div id="n_eqNew" hidden><div class="two"><div class="f"><label for="n_tag">TAG</label><input id="n_tag" placeholder="TQ-01"></div><div class="f"><label for="n_serie">Nº de série</label><input id="n_serie"></div></div><div class="f" style="margin-top:10px"><label for="n_desc">Descrição</label><input id="n_desc" placeholder="Reservatório 10 m³"></div></div>
 <div class="f"><label for="n_tipo">Ensaio</label><select id="n_tipo">${ORDER.map(k=>`<option value="${k}" ${k===pre?"selected":""}>${TYPES[k].nome}</option>`).join("")}</select></div>
 <button class="btn acc" data-act="criar">Iniciar inspeção</button></div></main>`}
function syncNova(){const cs=$("#n_cli");if(!cs)return;const cid=cs.value;$("#n_cliNew").hidden=cid!=="__new";
 const es=$("#n_eq");const eqs=S.equips.filter(e=>e.clientId===cid);es.innerHTML=eqs.map(e=>`<option value="${e.id}">${esc(e.tag)} · ${esc(e.desc)}</option>`).join("")+'<option value="__new">+ Novo equipamento…</option>';
 if(V.eq&&eqs.some(e=>e.id===V.eq))es.value=V.eq;$("#n_eqNew").hidden=es.value!=="__new"}

/* ---------- Render ---------- */
function render(){const m={home:vHome,all:vAll,clients:vClients,client:vClient,equip:vEquip,insp:vInsp,cfg:vCfg,nova:vNova}[V.name]||vHome;
 const h=m();if(h===undefined)return;$("#app").innerHTML=h+nav();
 document.querySelectorAll("img[data-pid]").forEach(async im=>{im.src=await photoURL(im.dataset.pid)});
 if(V.name==="nova"){if(V.cli)$("#n_cli").value=V.cli;syncNova()}}
const back=()=>{const i=V.name==="insp"&&S.insps.find(x=>x.id===V.id);if(i)return go({name:"equip",id:i.equipId});if(V.name==="equip"){const e=S.equips.find(x=>x.id===V.id);return go(e?{name:"client",id:e.clientId}:{name:"clients"})}if(V.name==="client")return go({name:"clients"});go({name:"home"})};

/* ---------- Ações ---------- */
let confirmAt={};function confirmar(key,btn,txt){const now=Date.now();if(confirmAt[key]&&now-confirmAt[key]<4000){confirmAt={};return true}confirmAt={[key]:now};btn.textContent=txt;return false}
function nextNum(tipo){const s=TYPES[tipo].sig;S.cfg.seq=S.cfg.seq||{};S.cfg.seq[s]=(S.cfg.seq[s]||0)+1;return`VTX-${s}-${String(S.cfg.seq[s]).padStart(4,"0")}`}
function novaInsp(equipId,tipo){const t=TYPES[tipo];const i={id:uid(),equipId,tipo,data:hoje(),num:nextNum(tipo),f:{},med:t.med?[0,1,2].map(t.med.novo):[],fotos:[],obs:"",override:"",upd:Date.now()};S.insps.push(i);save();go({name:"insp",id:i.id})}
const curI=()=>S.insps.find(x=>x.id===V.id);

document.addEventListener("click",async ev=>{
 const b=ev.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.go)return go({name:d.go});
 if("back"in d)return back();
 if(d.open)return go({name:"insp",id:d.open});
 if(d.cli)return go({name:"client",id:d.cli});
 if(d.eq)return go({name:"equip",id:d.eq});
 if(d.tab){V.tab=d.tab;return render()}
 if(d.proj)return abrirProj(d.proj);
 if(d.delm!==undefined){const i=curI();i.med.splice(+d.delm,1);i.upd=Date.now();save();return render()}
 if(d.delp!==undefined){const i=curI();if(!confirmar("p"+d.delp,b,"Excluir?"))return;const[p]=i.fotos.splice(+d.delp,1);apagaArq(p);i.upd=Date.now();save();return render()}
 const a=d.act;if(!a)return;
 if(a==="nova"){if(V.name==="equip")return go({name:"nova",cli:clOf(S.equips.find(e=>e.id===V.id)).id,eq:V.id,tipo:d.tipo});return go({name:"nova",tipo:d.tipo})}
 if(a==="novoEq")return novaInsp(d.e,d.tipo);
 if(a==="criar"){let cid=$("#n_cli").value;
  if(cid==="__new"){const n=$("#n_cliNome").value.trim();if(!n)return toast("Informe o nome do cliente");const c={id:uid(),nome:n,upd:Date.now()};S.clients.push(c);cid=c.id}
  let eid=$("#n_eq").value;
  if(eid==="__new"||!eid){const tag=$("#n_tag").value.trim();if(!tag)return toast("Informe a TAG do equipamento");const e={id:uid(),clientId:cid,tag,serie:$("#n_serie").value.trim(),desc:$("#n_desc").value.trim(),upd:Date.now()};S.equips.push(e);eid=e.id}
  return novaInsp(eid,$("#n_tipo").value)}
 if(a==="addCli"){return sheet("Novo cliente",`<div class="f"><label for="s1">Nome do cliente</label><input id="s1" placeholder="Ex.: Águia"></div>`,()=>{const n=$("#s1").value.trim();if(!n)return toast("Informe o nome");S.clients.push({id:uid(),nome:n,upd:Date.now()});save();render();return true})}

function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{res(im);setTimeout(()=>URL.revokeObjectURL(u),1000)};im.onerror=rej;im.src=u})}
async function carimbar(file,i){const im=await loadImg(file);const MAX=1600;let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,MAX/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
 const cv=document.createElement("canvas");cv.width=w;cv.height=h;const g=cv.getContext("2d");g.drawImage(im,0,0,w,h);
 const e=eqOf(i),c=clOf(e),dt=new Date();const fs=Math.max(14,Math.round(w*0.022));const pad=Math.round(fs*0.6);const bh=fs*2+pad*2.4;
 g.fillStyle="rgba(23,44,53,.78)";g.fillRect(0,h-bh,w,bh);g.fillStyle="#fff";g.textBaseline="top";
 g.font=`600 ${fs}px Arial, sans-serif`;g.fillText(`${c.nome} · ${e.tag} · ${TYPES[i.tipo].nome}`,pad,h-bh+pad);
 g.font=`${Math.round(fs*0.85)}px Arial, sans-serif`;g.fillStyle="#E8C9B0";g.fillText(`${dt.toLocaleDateString("pt-BR")} ${dt.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})} · ${i.num||""} · Voltex Qualidade`,pad,h-bh+pad+fs*1.2);
 const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.85));return{blob,w,h}}

 const w=document.createElement("div");w.className="sheet";w.innerHTML=`<div class="card"><h3>Restaurar backup?</h3><p class="note" style="margin:0">O backup tem ${bk.S.clients.length} cliente(s), ${bk.S.insps.length} inspeção(ões), ${(bk.S.projetos||[]).length} projeto(s) e ${np} arquivo(s). Os dados atuais deste celular (${S.insps.length} inspeção(ões)) serão substituídos.</p><div class="row"><button class="btn" data-x>Cancelar</button><button class="btn pri" data-ok>Restaurar</button></div></div>`;
 document.body.appendChild(w);
 w.addEventListener("click",async ev=>{if(ev.target===w||ev.target.closest("[data-x]"))return w.remove();
  if(!ev.target.closest("[data-ok]"))return;w.remove();toast("Restaurando…");
  try{for(const id of Object.keys(urls)){URL.revokeObjectURL(urls[id]);delete urls[id]}mem.photos={};await tx("photos","readwrite",st=>st.clear());
  for(const[id,u]of Object.entries(bk.photos||{}))await putPhoto(id,dataURLtoBlob(u));
  S=Object.assign({clients:[],equips:[],insps:[],projetos:[],deleted:{},cfg:{inspetor:"",seq:{}}},bk.S);clearTimeout(saveT);await tx("kv","readwrite",st=>st.put(JSON.stringify(S),"state"));
  toast("Backup restaurado");go({name:"home"})}catch(err){toast("Erro ao restaurar o backup")}})});

/* ---------- Projetos em PDF ---------- */
let projEq=null;
$("#pdfIn").addEventListener("change",async e=>{const fs=[...e.target.files];e.target.value="";if(!fs.length||!projEq)return;let n=0;
 for(const f of fs){if(!/pdf$/i.test(f.type)&&!/\.pdf$/i.test(f.name)){toast("Escolha um arquivo PDF");continue}
  const id=uid();const blob=new Blob([await f.arrayBuffer()],{type:"application/pdf"});await putPhoto(id,blob);
  S.projetos.push({id,equipId:projEq,nome:f.name.replace(/\.pdf$/i,""),tam:f.size,data:hoje(),upd:Date.now()});n++}
 save();toast(n+" PDF(s) adicionado(s)");const eid=projEq;projEq=null;if(V.name==="equip"||V.name==="all")render();else go({name:"equip",id:eid})});
async function abrirProj(id){const p=(S.projetos||[]).find(x=>x.id===id);if(!p)return;const e=S.equips.find(x=>x.id===p.equipId)||{},c=clOf(e);
 const bl=await getPhoto(p.id);const drive=p.driveId?`https://drive.google.com/file/d/${p.driveId}/view`:"";
 const w=document.createElement("div");w.className="sheet";w.innerHTML=`<div class="card"><h3 style="overflow-wrap:anywhere">${esc(p.nome)}</h3><div class="note">${esc(c.nome)} · ${esc(e.tag)} · ${fmtMB(p.tam||0)} · adicionado em ${fmtData(p.data)}</div>
 <div style="display:flex;flex-direction:column;gap:8px">${bl?'<button class="btn pri" data-ab>Abrir PDF</button><button class="btn" data-sv>Salvar / enviar</button>':'<div class="empty">O arquivo ainda não está neste aparelho. Sincronize com o Google Drive para baixá-lo.</div>'}
 ${drive?`<a class="btn" style="text-align:center;text-decoration:none;color:inherit" href="${drive}" target="_blank" rel="noopener">Abrir no Google Drive</a>`:""}
 <button class="btn" data-eqv>Ver equipamento</button><button class="btn dng" data-del>Excluir projeto</button><button class="btn" data-x>Fechar</button></div></div>`;
 document.body.appendChild(w);let conf=0;
 w.addEventListener("click",ev=>{const t=ev.target;if(t===w||t.closest("[data-x]"))return w.remove();
  if(t.closest("[data-ab]")){const u=URL.createObjectURL(bl);const a=document.createElement("a");a.href=u;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),120000)}
  if(t.closest("[data-sv]")){w.remove();salvarArquivo(slug(c.nome)+"_"+slug(e.tag)+"_"+p.nome.replace(/[^\w\-. ]+/g,"_")+".pdf",bl)}
  if(t.closest("[data-eqv]")){w.remove();go({name:"equip",id:p.equipId})}
  if(t.closest("[data-del]")){if(!conf){conf=1;t.closest("[data-del]").textContent="Toque de novo para excluir";return}
   apagaArq(p);S.projetos=S.projetos.filter(x=>x!==p);save();w.remove();render();toast("Projeto excluído")}})}

/* ---------- Sincronização com Google Drive ---------- */
let TK={t:"",exp:0},tkClient=null,syncing=false,syncAgain=false,syncT=null;
const tokOk=()=>!!TK.t&&TK.exp>Date.now()+60000;
const DAPI="https://www.googleapis.com/drive/v3",UAPI="https://www.googleapis.com/upload/drive/v3",ROOT="Voltex Qualidade";
function pedirToken(){return new Promise((res,rej)=>{
 if(!window.google?.accounts?.oauth2)return rej(new Error("Não foi possível carregar o login do Google. Verifique a internet."));
 if(!tkClient||tkClient._cid!==LC.cid){tkClient=google.accounts.oauth2.initTokenClient({client_id:LC.cid,scope:"https://www.googleapis.com/auth/drive.file",callback:()=>{}});tkClient._cid=LC.cid}
 tkClient.callback=r=>{if(r.error)return rej(new Error(r.error_description||r.error));TK={t:r.access_token,exp:Date.now()+(+r.expires_in||3600)*1000};try{localStorage.setItem("vtx-tk",JSON.stringify(TK))}catch(e){}res(TK.t)};
 tkClient.error_callback=e=>rej(new Error(e?.type==="popup_closed"?"Login cancelado":"Não foi possível abrir o login do Google"));
 tkClient.requestAccessToken({prompt:LC.ok?"":"consent"})})}
async function gf(url,opt={}){const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:"Bearer "+TK.t}});
 if(r.status===401){TK={t:"",exp:0};throw new Error("Login expirado. Toque em Sincronizar.")}
 if(!r.ok){let m="";try{m=(await r.json()).error.message}catch(e){}throw new Error("Google Drive respondeu "+r.status+(m?": "+m:""))}return r}
const qs=v=>String(v).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
async function dFind(name,parent,folder){const q=[`name='${qs(name)}'`,"trashed=false",`'${parent||"root"}' in parents`];if(folder)q.push("mimeType='application/vnd.google-apps.folder'");
 const r=await gf(`${DAPI}/files?q=${encodeURIComponent(q.join(" and "))}&fields=files(id,name)&spaces=drive&pageSize=10`);return(await r.json()).files[0]||null}
const fcache={};
async function dPasta(name,parent){name=String(name||"-").replace(/[\/\\]/g,"-").trim()||"-";const k=(parent||"root")+"|"+name;if(fcache[k])return fcache[k];
 let f=await dFind(name,parent,true);
 if(!f){const r=await gf(`${DAPI}/files?fields=id`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,mimeType:"application/vnd.google-apps.folder",parents:[parent||"root"]})});f=await r.json()}
 return fcache[k]=f.id}
async function dEnviar(meta,blob,fileId){const b="vtx"+uid();const body=new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${blob.type||"application/octet-stream"}\r\n\r\n`,blob,`\r\n--${b}--`]);
 const r=await gf(fileId?`${UAPI}/files/${fileId}?uploadType=multipart&fields=id`:`${UAPI}/files?uploadType=multipart&fields=id`,{method:fileId?"PATCH":"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body});return(await r.json()).id}
async function dBaixar(id){return await(await gf(`${DAPI}/files/${id}?alt=media`)).blob()}

function juntaLista(a,b,del,ehInsp){const m=new Map();
 for(const x of[...a,...b]){const o=m.get(x.id);if(!o){m.set(x.id,x);continue}
  const[w,l]=(x.upd||0)>(o.upd||0)?[x,o]:[o,x];
  if(ehInsp){const ids=new Set(w.fotos.map(p=>p.id));for(const p of l.fotos||[])if(!ids.has(p.id)&&!del[p.id])w.fotos.push(p);
   const dr={};for(const p of l.fotos||[])if(p.driveId)dr[p.id]=p.driveId;for(const p of w.fotos)if(!p.driveId&&dr[p.id])p.driveId=dr[p.id]}
  else if(!w.driveId&&l.driveId)w.driveId=l.driveId;
  m.set(x.id,w)}
 return[...m.values()].filter(x=>!(del[x.id]&&del[x.id]>=(x.upd||0)))}
function juntaEstado(R){const del={...(S.deleted||{})};for(const[k,v]of Object.entries(R.deleted||{}))del[k]=Math.max(del[k]||0,v);
 const corte=Date.now()-180*864e5;for(const k in del)if(del[k]<corte)delete del[k];S.deleted=del;
 S.clients=juntaLista(S.clients||[],R.clients||[],del);S.equips=juntaLista(S.equips||[],R.equips||[],del);
 S.insps=juntaLista(S.insps||[],R.insps||[],del,1);S.projetos=juntaLista(S.projetos||[],R.projetos||[],del);
 for(const i of S.insps)i.fotos=i.fotos.filter(p=>!del[p.id]);
 const seq={...(R.cfg?.seq||{})};for(const[k,v]of Object.entries(S.cfg.seq||{}))seq[k]=Math.max(seq[k]||0,v);S.cfg.seq=seq;
 if(!S.cfg.inspetor&&R.cfg?.inspetor)S.cfg.inspetor=R.cfg.inspetor;if(!S.cfg.registro&&R.cfg?.registro)S.cfg.registro=R.cfg.registro}

function setSync(st,msg){SYNC={st,msg:msg||""};const el=document.querySelector(".sync");if(el)el.outerHTML=syncChip();const c=document.getElementById("driveSt");if(c)c.innerHTML=driveStTxt()}
function driveStTxt(){const h=LC.last?new Date(LC.last).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
 return SYNC.st==="run"?"Sincronizando…":SYNC.st==="err"?"Erro: "+esc(SYNC.msg):SYNC.st==="pend"?"Alterações aguardando sincronização. Toque em Sincronizar.":SYNC.st==="off"?"Sem internet. Sincroniza quando a conexão voltar.":h?"Sincronizado em "+h:"Ainda não sincronizado"}
function syncChip(){const c={ok:"ok",pend:"pend",err:"err",run:"run",off:"pend"}[SYNC.st]||(LC.last?"ok":"pend");
 const t=SYNC.st==="run"?"Sincronizando…":SYNC.st==="err"?"Erro ao sincronizar · tocar":SYNC.st==="pend"||SYNC.st==="off"||!LC.last?"Google Drive · tocar para sincronizar":"Drive sincronizado "+new Date(LC.last).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
 return`<button class="sync ${c}" data-act="sync"><i></i>${t}</button>`}
function cardDrive(){
 if(!LC.cid)return`<div class="card"><h3>Google Drive</h3><p class="note" style="margin:0">Sincroniza inspeções, fotos e projetos entre o celular e o computador, e guarda tudo na pasta <b>Voltex Qualidade</b> do seu Google Drive. Para ativar, cole o ID do cliente OAuth criado no Google Cloud.</p>
 <div class="f"><label for="c_cid">ID do cliente (termina em .apps.googleusercontent.com)</label><input id="c_cid" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="123456-abc.apps.googleusercontent.com"></div>
 <button class="btn pri" data-act="cid">Salvar ID</button></div>`;
 return`<div class="card"><h3>Google Drive</h3><div class="note" id="driveSt">${driveStTxt()}</div>
 <div class="row"><button class="btn pri" data-act="sync">${LC.ok?"Sincronizar agora":"Conectar ao Google Drive"}</button>${LC.ok?'<button class="btn" data-act="desc">Desconectar</button>':""}</div>
 <div class="f"><label>ID do cliente</label><code>${esc(LC.cid)}</code></div>
 <p class="note" style="margin:0">Fotos, projetos e os relatórios PDF que você exportar ficam na pasta <b>Voltex Qualidade</b> do Google Drive, separados por Cliente → TAG → Ensaio.</p>
 <button class="btn" data-act="cidDel">Trocar ID do cliente</button></div>`}

function agendaSync(){if(!IS_PWA||!LC.cid)return;clearTimeout(syncT);
 if(!tokOk()){if(LC.ok&&SYNC.st!=="run")setSync("pend");return}
 syncT=setTimeout(()=>sincronizar(false),8000)}
async function sincronizar(interativo){
 if(!IS_PWA)return;if(!LC.cid){toast("Configure o Google Drive em Ajustes");return go({name:"cfg"})}
 if(syncing){syncAgain=true;return}
 if(!navigator.onLine){setSync("off");if(interativo)toast("Sem internet agora");return}
 clearTimeout(syncT);
 try{if(!tokOk()){if(!interativo)return setSync("pend");await pedirToken()}
  if(!LC.ok){LC.ok=true;saveLC()}
  syncing=true;setSync("run");
  const root=await dPasta(ROOT,null);
  const df=await dFind("dados.json",root,false);
  if(df){const R=await(await gf(`${DAPI}/files/${df.id}?alt=media`)).json();if(R&&R.app==="voltex-qc"&&R.S)juntaEstado(R.S)}
  // enviar fotos e projetos novos
  for(const i of S.insps){const e=eqOf(i),c=clOf(e);for(let k=0;k<i.fotos.length;k++){const p=i.fotos[k];if(p.driveId)continue;const bl=await getPhoto(p.id);if(!bl)continue;
   const pasta=await dPasta(`${TYPES[i.tipo]?.sig||i.tipo} ${i.num||""}`.trim(),await dPasta(e.tag||"sem TAG",await dPasta(c.nome||"sem cliente",root)));
   p.driveId=await dEnviar({name:fotoNome(i,k),parents:[pasta],description:p.leg||""},bl);i.upd=Date.now()}}
  for(const p of S.projetos){if(p.driveId)continue;const bl=await getPhoto(p.id);if(!bl)continue;const e=S.equips.find(x=>x.id===p.equipId)||{},c=clOf(e);
   const pasta=await dPasta("Projeto",await dPasta(e.tag||"sem TAG",await dPasta(c.nome||"sem cliente",root)));
   p.driveId=await dEnviar({name:p.nome+".pdf",parents:[pasta]},bl);p.upd=Date.now()}
  // baixar o que veio de outro aparelho
  for(const i of S.insps)for(const p of i.fotos)if(p.driveId&&!(await getPhoto(p.id))){try{await putPhoto(p.id,await dBaixar(p.driveId))}catch(e){}}
  for(const p of S.projetos)if(p.driveId&&!(await getPhoto(p.id))){try{await putPhoto(p.id,await dBaixar(p.driveId))}catch(e){}}
  // mandar para a lixeira do Drive o que foi excluído
  const fica=[];for(const id of LC.trash){try{await gf(`${DAPI}/files/${id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({trashed:true})})}catch(e){if(!/ 404/.test(e.message))fica.push(id)}}LC.trash=fica;
  // gravar o estado juntado
  const js=new Blob([JSON.stringify({app:"voltex-qc",v:2,em:new Date().toISOString(),S})],{type:"application/json"});
  if(df)await dEnviar({},js,df.id);else await dEnviar({name:"dados.json",parents:[root],description:"Dados do app Inspeção Qualidade. Não apague nem edite."},js);
  clearTimeout(saveT);await tx("kv","readwrite",s=>s.put(JSON.stringify(S),"state"));
  LC.last=Date.now();saveLC();syncing=false;setSync("ok");
  const foco=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);if(!foco)render();
  if(interativo)toast("Sincronizado com o Google Drive")}
 catch(e){syncing=false;setSync("err",e.message);if(interativo)toast(e.message)}
 finally{syncing=false;if(syncAgain){syncAgain=false;setTimeout(()=>sincronizar(false),1500)}}}
if(IS_PWA){window.addEventListener("online",()=>{if(LC.cid&&tokOk())sincronizar(false)});
 document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&LC.cid&&tokOk())sincronizar(false)})}

async function enviaRelatorio(i,blob,nome,tent){if(!IS_PWA||!LC.cid||!tokOk()||!navigator.onLine)return;
 try{const e=eqOf(i),c=clOf(e);const root=await dPasta(ROOT,null);
  const pasta=await dPasta(`${TYPES[i.tipo]?.sig||i.tipo} ${i.num||""}`.trim(),await dPasta(e.tag||"sem TAG",await dPasta(c.nome||"sem cliente",root)));
  i.relDriveId=await dEnviar(i.relDriveId?{name:nome}:{name:nome,parents:[pasta]},blob,i.relDriveId);i.upd=Date.now();save();toast("Relatório também salvo no Google Drive")}
 catch(err){if(i.relDriveId&&!tent&&/ 404/.test(err.message)){i.relDriveId="";return enviaRelatorio(i,blob,nome,1)}}}

/* ---------- App instalável ---------- */
if(IS_PWA){window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();instalar=e;if(V.name==="cfg"||V.name==="home")render()});
 window.addEventListener("appinstalled",()=>{instalar=null;toast("App instalado");render()});
 if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
 try{navigator.storage?.persist?.()}catch(e){}}

(async()=>{idb=await openDB();const raw=await tx("kv","readonly",s=>s.get("state"));
 if(raw){try{S=Object.assign(S,JSON.parse(raw))}catch(e){}}else{seed();save()}
 S.projetos=S.projetos||[];S.deleted=S.deleted||{};
 const lr=await tx("kv","readonly",s=>s.get("local"));if(lr){try{LC=Object.assign(LC,JSON.parse(lr))}catch(e){}}
 if(IS_PWA&&!LC.cid&&!LC.semCid)LC.cid=CID_PADRAO;
 try{const t=JSON.parse(localStorage.getItem("vtx-tk")||"null");if(t&&t.exp>Date.now()+120000)TK=t}catch(e){}
 render();if(IS_PWA&&LC.cid&&tokOk())sincronizar(false);else if(IS_PWA&&LC.cid){SYNC={st:"pend",msg:""};render()}})();
render();
</script>
